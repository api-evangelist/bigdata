    EconomicEvent:
      properties:
        event_datetime:
          type: string
          format: date-time
          title: Event Datetime
          description: When the figure is released, in ISO 8601 format (UTC).
          examples:
          - '2026-02-10T13:30:00Z'
        country:
          type: string
          title: Country
          description: 'Country the release covers. Every value is an ISO 3166-1 alpha-2 code except one: ''EMU'', the euro area, which has no ISO code of its own.'
          examples:
          - US
        name:
          type: string
          title: Name
          description: Name of the economic indicator.
          examples:
          - Nonfarm Payrolls
        impact:
          anyOf:
          - $ref: '#/components/schemas/ImpactLevel'
          - type: 'null'
          description: 'Expected market impact: NONE, LOW, MEDIUM or HIGH.'
          examples:
          - HIGH
        period_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Period Date
          description: 'The period the figure describes, as ''YYYY-MM-DD'', which is not when it was released: a December CPI published in January describes December. Read it with ''period_type'', which says whether the period is that day, its month or its quarter. Absent on an event with no period, such as a central bank speech.'
          examples:
          - '2026-01-01'
        period_type:
          anyOf:
          - $ref: '#/components/schemas/PeriodType'
          - type: 'null'
          description: 'Granularity of the period: DAY, MONTH or QUARTER. ''NONE'' on a release that has no period behind it, such as a central bank speech, where ''period_date'' is absent too.'
          examples:
          - MONTH
        actual:
          anyOf:
          - type: number
          - type: 'null'
          title: Actual
          description: The released figure, in full units. Absent until the release happens, which is the usual state for a forward-looking window.
          examples:
          - 250000
        consensus:
          anyOf:
          - type: number
          - type: 'null'
          title: Consensus
          description: Market expectation, in full units.
          examples:
          - 200000
        previous:
          anyOf:
          - type: number
          - type: 'null'
          title: Previous
          description: The prior period's figure, in full units.
          examples:
          - 180000
        revised:
          anyOf:
          - type: number
          - type: 'null'
          title: Revised
          description: The prior period restated, in full units. When present, 'previous' is the figure as first published and this is the corrected one.
          examples:
          - 185000
        ratio_deviation:
          anyOf:
          - type: number
          - type: 'null'
          title: Ratio Deviation
          description: The provider's own measure of how far the released figure fell from consensus, as a ratio. Published by FXStreet alongside the figures; 'surprise' is the same idea expressed as a signed percentage.
          examples:
          - 0.25
        surprise:
          anyOf:
          - type: number
          - type: 'null'
          title: Surprise
          description: 'How far the released figure fell from the consensus, signed. Read it with ''surprise_unit'', which says which of two comparisons produced it: an indicator already published as a percentage is compared by subtraction, in percentage points, and every other indicator relatively, as a percentage of the consensus. Absent when either figure is, and for the relative comparison when the consensus is zero.'
          examples:
          - 25.0
        surprise_unit:
          anyOf:
          - $ref: '#/components/schemas/SurpriseUnit'
          - type: 'null'
          description: 'What ''surprise'' is measured in: ''pp'' for percentage points, on an indicator already published as a percentage such as a CPI rate, and ''%'' for a percentage of the consensus on every other indicator, such as a payroll count. Absent exactly when ''surprise'' is. Two surprises cannot be compared without it: -0.2pp and -6.25% describe the same release.'
          examples:
          - '%'
        is_better_than_expected:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Better Than Expected
          description: 'Whether the result is good for the economy, as judged by the provider. Direction-aware, unlike ''surprise'': a lower unemployment print is a negative surprise and better than expected.'
          examples:
          - true
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: 'What the figures are measured in: ''%'' for a rate, ''$'' for a monetary value, absent for a count such as jobs.'
          examples:
          - '%'
        category:
          anyOf:
          - $ref: '#/components/schemas/EconomicCategory'
          - type: 'null'
          description: The category this indicator is filed under, named the same way the 'categories' filter names one. Absent when the provider filed the event under no category.
          examples:
          - labor-market
        communication_types:
          items:
            $ref: '#/components/schemas/CommunicationType'
          type: array
          title: Communication Types
          description: 'The prose forms this entry takes: ''REPORT'' for a published document, ''SPEECH'' for spoken remarks, and both when it is both. Empty on an ordinary data release, which is most of a calendar.'
          examples:
          - - SPEECH
        is_all_day:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is All Day
          description: Whether the event covers the whole day rather than a moment in it. When true, the time of day carried by 'event_datetime' is a convention and not a release time.
          examples:
          - false
        is_tentative:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Tentative
          description: Whether the timing is provisional. When true, 'event_datetime' is the provider's best estimate of when the figure lands rather than a scheduled time, so do not rely on it to the minute.
          examples:
          - false
        actual_is_preliminary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Actual Is Preliminary
          description: Whether 'actual' is a first estimate. A preliminary figure is normally restated in a later release.
          examples:
          - false
        previous_is_preliminary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Previous Is Preliminary
          description: Whether 'previous' is a first estimate rather than a settled figure. This is what a value in 'revised' corrects.
          examples:
          - false
