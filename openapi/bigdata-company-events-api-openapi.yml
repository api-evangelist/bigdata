          - - US
            - GB
            - EMU
        impacts:
          anyOf:
          - items:
              $ref: '#/components/schemas/ImpactLevel'
            type: array
          - type: 'null'
          title: Impacts
          description: Expected market impact levels to return. Omit for every level. Case does not matter.
          examples:
          - - HIGH
            - MEDIUM
        categories:
          anyOf:
          - items:
              $ref: '#/components/schemas/EconomicCategory'
            type: array
          - type: 'null'
          title: Categories
          description: 'Categories to filter by. Valid values: bond-auctions, capital-flows, central-banks, consumption, economic-activity, energy, holidays, housing-market, inflation, interest-rates, labor-market, politics. Omit for every category. A value outside that set is rejected.'
