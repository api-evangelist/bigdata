    EconomicCalendarResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/EconomicEvent'
          type: array
          title: Results
          description: 'The releases in the requested window, ordered by date then country. There is no pagination: the provider serves no cursor, so there is nothing to resume from. A response is capped at 2000 releases and the earliest are kept, so a window that comes back with exactly 2000 may have more that were not returned. An unfiltered window reaches that inside a couple of months, since every country together runs to tens of releases a day once the low-impact ones are counted. Narrow the date range, the countries or the impact levels to stay under it.'
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorDetail'
            type: array
          - type: 'null'
          title: Errors
        metadata:
          anyOf:
          - $ref: '#/components/schemas/Metadata'
          - type: 'null'
        sources:
          items:
            $ref: '#/components/schemas/Source'
          type: array
          title: Sources
          description: The content catalog sources the response was built from, one entry per source. Empty when no catalog source contributed.
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
          description: Tokens the request consumed, per content tier. Present only for API keys billed in tokens.
      type: object
      required:
      - results
      title: EconomicCalendarResponse
      example:
        results:
        - actual: 250000
          actual_is_preliminary: false
          category: labor-market
          communication_types: []
          consensus: 200000
          country: US
          event_datetime: '2026-02-10T13:30:00Z'
          impact: HIGH
          is_all_day: false
          is_better_than_expected: true
