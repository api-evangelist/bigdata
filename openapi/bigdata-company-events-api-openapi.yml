openapi: 3.2.0
info:
  title: Bigdata Structured Data Company & Events API
  description: Bigdata API documentation
  version: 1.0.0
servers:
- url: https://api.bigdata.com/
security:
- ApiKeyAuth: []
tags:
- name: Company & Events
  description: Company information and events including company profile and events calendar
paths:
  /v1/company-profile/query:
    post:
      tags:
      - Company & Events
      summary: Company Profile
      description: This endpoint retrieves comprehensive company profile data including company name, sector, industry, CEO, market cap, and other key business information.
      operationId: query_company_profile_v1_company_profile_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCompanyProfileResponse'
  /v1/company-screener/query:
    post:
      tags:
      - Company & Events
      summary: Stocks & Funds Screener
      description: 'The Company Screener API enables advanced filtering and discovery of companies based on comprehensive financial and descriptive criteria.


        Filter companies by market capitalization, stock price, beta, trading volume, dividend yield, sector, industry, country, exchange,

        and trading status. Perfect for investment research, portfolio construction, and market analysis.'
      operationId: query_company_screener_v1_company_screener_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyScreenerQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCompanyScreenerResponse'
  /v1/events-calendar/query:
    post:
      tags:
      - Company & Events
      summary: Events Calendar
      description: 'A financial data API that returns details of key corporate events, such as earnings

        calls, conference calls, US IPO listings, and US delistings. Query by a specific list of

        companies, by date range alone, or both, allowing investors and analysts to track upcoming

        and historical company announcements in real time.'
      operationId: query_events_calendar_v1_events_calendar_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsCalendarQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsCalendarResponse'
  /v1/esg-performance-score/query:
    post:
      tags:
      - Company & Events
      summary: ESG Scores
      description: 'The ESG Performance Score API provides a comprehensive evaluation of a company''s environmental, social, and governance (ESG) practices. It aggregates various ESG metrics into a single performance score, allowing investors and stakeholders to assess the company''s commitment to sustainable and responsible business operations.


        The ESG scores reflect companies'' sustainability performance relative to financially material ESG issues. Scores are derived from standardized company-reported data and peer-based relative scoring techniques, resulting in a 0–100 scale that indicates a company''s position versus its global peers, following a sector-specific, SASB (Sustainability Accounting Standards Board)-inspired materiality framework.


        | Performance | Score Range |

        |---|---|

        | Laggard | < 42 |

        | Below Average | 42 - 47 |

        | Average | 48 - 53 |

        | Above Average | 54 - 59 |

        | Leader | ≥ 60 |'
      operationId: query_esg_performance_score_v1_esg_performance_score__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicGetPerformanceScoreQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicESGPerformanceScoreResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /v1/economic-calendar/query:
    post:
      tags:
      - Company & Events
      summary: Economic Calendar
      description: 'Returns the macroeconomic releases scheduled in a window: inflation, growth,

        employment, central bank decisions and the rest of the economic calendar, for the

        countries requested. Each release carries the figure published, the market consensus

        and the prior period, so a caller can see both what was expected and what landed.

        Figures are returned in full units. There is no pagination, and a response is capped

        at 1000 releases, so narrow the window or the filters to stay under it.'
      operationId: query_economic_calendar_v1_economic_calendar_query__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicCalendarQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicCalendarResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
