    PublicGetPerformanceScoreQuery:
      properties:
        identifier:
          $ref: '#/components/schemas/SingleIdentifier'
          description: Object specifying which identifier you are using to request the company's environmental, social and governance (ESG) scores. You must supply one type and its corresponding value.
      type: object
      required:
      - identifier
      title: PublicGetPerformanceScoreQuery
      description: 'Schema for the request to the public API.


        Only contains the identifier:

        - type: the identifier type (e.g., "rp_entity_id")

        - value: a single RP Entity ID or a list of IDs'
    EconomicCategory:
      type: string
      enum:
      - bond-auctions
      - capital-flows
      - central-banks
      - consumption
      - economic-activity
      - energy
      - holidays
      - housing-market
      - inflation
      - interest-rates
      - labor-market
      - politics
      title: EconomicCategory
    Usage:
      additionalProperties:
        type: integer
      type: object
      title: Usage
      description: 'Public structured-data usage for a request, aggregated per content tier.


        A flat object keyed per content tier, where each key is derived from the

        content tier identifier by dropping the ``content-`` prefix and appending

        ``_tokens`` (e.g. ``corporate-fundamentals`` ->

        ``corporate_fundamentals_tokens``). It is sparse: only tiers with non-zero

        tokens appear, and an absent key means zero tokens for that tier.'
    ScreenedCompany:
      properties:
        rp_entity_id:
          type: string
          maxLength: 6
          minLength: 6
          title: Rp Entity Id
          description: 'Bigdata uses the RavenPack Entity identifier (RP_Entity_ID) to uniquely reference entities such as companies. This identifier is a 6-character alphanumeric code (letters and numbers only). Example: Alphabet Inc. (`4A6F00`)'
